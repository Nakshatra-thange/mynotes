<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notes</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📒</text></svg>">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="traffic"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div>
    <div class="folder active"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span>Notes</span><b id="count">0</b></div>
  </aside>

  <section class="list">
    <header>
      <div class="h-title"><strong>Notes</strong><small id="subcount"></small></div>
      <button class="icon" id="newBtn" title="New note (N)"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>
    </header>
    <div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg><input id="search" placeholder="Search" autocomplete="off"></div>
    <div class="items" id="items"></div>
  </section>

  <main class="editor-wrap">
    <div class="toolbar">
      <button class="icon back" id="backBtn" title="Back"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
      <div class="group">
        <button class="icon" data-cmd="format" title="Format"><span class="aa">Aa</span></button>
        <button class="icon" data-cmd="check" title="Checklist"><svg viewBox="0 0 24 24"><circle cx="6" cy="7" r="2.5"/><path d="M12 7h8"/><circle cx="6" cy="17" r="2.5"/><path d="M12 17h8"/></svg></button>
        <button class="icon" data-cmd="table" title="Table"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M3 15h18M9 4v16M15 4v16"/></svg></button>
        <button class="icon" data-cmd="photo" title="Add photo"><svg viewBox="0 0 24 24"><path d="m21 12-8.5 8.5a5.5 5.5 0 0 1-8-8L13 4a3.7 3.7 0 0 1 5.3 5.3l-8.6 8.6a1.8 1.8 0 0 1-2.6-2.6L14.5 8"/></svg></button>
      </div>
      <div class="spacer"></div>
      <button class="icon" data-cmd="pin" title="Pin note"><svg viewBox="0 0 24 24"><path d="M12 17v5M9 3h6l-1 7 4 4H6l4-4z"/></svg></button>
      <button class="icon" data-cmd="delete" title="Delete note"><svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg></button>
      <div class="menu" id="fmtMenu">
        <button data-fmt="h1">Title</button><button data-fmt="h2">Heading</button><button data-fmt="h3">Subheading</button><button data-fmt="p">Body</button>
        <hr><button data-fmt="bold"><b>Bold</b></button><button data-fmt="italic"><i>Italic</i></button><button data-fmt="underline"><u>Underline</u></button>
        <hr><button data-fmt="ul">• Bulleted list</button><button data-fmt="ol">1. Numbered list</button>
      </div>
    </div>
    <div class="date" id="date"></div>
    <div class="editor" id="editor" contenteditable="true" spellcheck="true"></div>
    <div class="empty" id="empty">No note selected</div>
    <input type="file" id="file" accept="image/*" hidden multiple>
  </main>
</div>
<script src="notes-data.js"></script>
<script src="app.js"></script>
</body>
</html>
